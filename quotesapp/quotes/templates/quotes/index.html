{% extends 'quotes/base.html' %}
{% load extract %}
{% block content %}

<div class="row" bis_skin_checked="1">
    <div class="col-md-8" bis_skin_checked="1">
        {% for quote in quotes %}
        <div class="quote" itemscope="" it emtype="http://schema.org/CreativeWork" bis_skin_checked="1">
            <span class="text" itemprop="text">
                {{quote.quote}}
            </span>
            <span>by <small class="author" itemprop="author">{{quote.author|author}}</small>
                <a href="/author/{{quote.author}}">(about)</a>
            </span>
            <div class="tags" bis_skin_checked="1">
                Tags:
                {% for tag in quote.tags %}
                <a class="tag" href="/tag/{{tag}}">{{tag}}</a>
                    {% endfor %}

            </div>
        </div>
        {% endfor %}

        <nav>
            <ul class="pager">
                <li class="previous">
                    <a class="pager-link {% if not quotes.has_previous %}disabled{% endif %}" href="{% if quotes.has_previous %}{% url 'quotes:root_paginate' quotes.previous_page_number %}{% else %}#{% endif %}">
                        <span aria-hidden="true">←</span> Previous
                    </a>
                </li>

                <li class="next">
                    <a class="pager-link {% if not quotes.has_next %}disabled{% endif %}" href="{% if quotes.has_next %}{% url 'quotes:root_paginate' quotes.next_page_number %}{% else %}#{% endif %}">
                        Next <span aria-hidden="true">→</span>
                    </a>
                </li>

            </ul>
        </nav>
    </div>
</div>

{% endblock %}
