{% extends 'quotes/base.html' %}
{% load static %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Login</h2>
    <p class="auth-sub">Sign in to your account.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Login</button>
    </form>
    <a class="alt-link" href="{% url 'register' %}">Don't have an account? Sign up</a>
  </div>
</div>
{% endblock %}
